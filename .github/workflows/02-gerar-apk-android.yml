name: Gerar APK Debug - Smart Notes 1.4.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal
    paths:
      - 'mobile-app/**'
      - 'scripts/mobile/**'
      - '.github/workflows/02-gerar-apk-android.yml'

permissions:
  contents: read

jobs:
  apk-debug:
    name: Compilar Smart-Notes-Debug.apk
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar arquivos de configuração
        run: |
          $arquivos = @(
            'mobile-app/package.json',
            'mobile-app/capacitor.config.json',
            'mobile-app/src/main.jsx',
            'scripts/mobile/Aplicar-Ajustes-Android.ps1'
          )
          $ausentes = @($arquivos | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($ausentes.Count -gt 0) {
            throw "Arquivos obrigatórios ausentes: $($ausentes -join ', ')"
          }
          Get-Content -LiteralPath 'mobile-app/package.json' -Raw | ConvertFrom-Json | Out-Null
          Get-Content -LiteralPath 'mobile-app/capacitor.config.json' -Raw | ConvertFrom-Json | Out-Null

      - name: Instalar dependências
        working-directory: mobile-app
        run: npm install --no-audit --no-fund

      - name: Validar JavaScript, JSX e TypeScript
        working-directory: mobile-app
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'A compilação Vite encontrou erro em JavaScript ou JSX.' }
          $fontes = @(Get-ChildItem -LiteralPath 'src' -Recurse -File | Where-Object { $_.Extension -in '.js', '.jsx', '.ts', '.tsx' } | ForEach-Object { $_.FullName })
          if ($fontes.Count -eq 0) { throw 'Nenhum arquivo-fonte foi encontrado.' }
          npx tsc --noEmit --allowJs --checkJs false --jsx react-jsx --module ESNext --target ES2022 --moduleResolution Bundler --skipLibCheck @fontes
          if ($LASTEXITCODE -ne 0) { throw 'O TypeScript encontrou erro de sintaxe nos arquivos JavaScript/JSX.' }

      - name: Criar projeto Android
        working-directory: mobile-app
        run: |
          if (Test-Path -LiteralPath 'android') {
            Remove-Item -LiteralPath 'android' -Recurse -Force
          }
          npx cap add android
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar o projeto Android com Capacitor.' }
          npx cap sync android
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao sincronizar o projeto Android com Capacitor.' }
          if (-not (Test-Path -LiteralPath 'android/gradlew.bat' -PathType Leaf)) {
            throw 'gradlew.bat não foi criado.'
          }

      - name: Aplicar versão e ícones Android
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/mobile/Aplicar-Ajustes-Android.ps1" -AndroidPath "$env:GITHUB_WORKSPACE/mobile-app/android"

      - name: Compilar APK Debug
        working-directory: mobile-app/android
        run: |
          .\gradlew.bat assembleDebug --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'O Gradle não conseguiu gerar o APK Debug.' }
          $origem = 'app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path -LiteralPath $origem -PathType Leaf)) { throw "APK não encontrado em $origem" }
          $destino = Join-Path $env:GITHUB_WORKSPACE 'APK'
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item -LiteralPath $origem -Destination (Join-Path $destino 'Smart-Notes-v1.4.4-Debug.apk') -Force
          $hash = (Get-FileHash -LiteralPath (Join-Path $destino 'Smart-Notes-v1.4.4-Debug.apk') -Algorithm SHA256).Hash
          "SHA256: $hash" | Set-Content -LiteralPath (Join-Path $destino 'Smart-Notes-v1.4.4-Debug-SHA256.txt') -Encoding utf8
          "APK Debug 1.4.4 gerado com sucesso." >> $env:GITHUB_STEP_SUMMARY

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Notes-APK-Debug-1.4.4
          path: APK/
          if-no-files-found: error
          retention-days: 30
