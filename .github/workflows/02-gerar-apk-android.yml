name: 02 - Gerar APK Android - Smart Notes 1.4.3

on:
  workflow_dispatch:
  push:
    branches: [main, principal]
    paths:
      - 'mobile-app/**'
      - 'scripts/mobile/**'
      - '.github/workflows/02-gerar-apk-android.yml'

permissions:
  contents: read

jobs:
  gerar-apk:
    name: Gerar Smart-Notes.apk
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar estrutura mobile
        run: |
          $obrigatorios = @(
            'mobile-app/package.json',
            'mobile-app/capacitor.config.json',
            'mobile-app/src/main.jsx',
            'scripts/mobile/Aplicar-Ajustes-Android.ps1'
          )
          $ausentes = $obrigatorios | Where-Object { -not (Test-Path $_) }
          if ($ausentes.Count -gt 0) {
            throw "Arquivos ausentes: $($ausentes -join ', ')"
          }

          Write-Host 'Configuração Capacitor JSON validada.' -ForegroundColor Green

      - name: Instalar dependências mobile
        working-directory: mobile-app
        run: |
          if (Test-Path 'node_modules') { Remove-Item 'node_modules' -Recurse -Force }
          npm install --no-audit --no-fund
          npx cap --version
          npm ls @capacitor/cli @capacitor/core @capacitor/android typescript --depth=0

      - name: Compilar interface mobile
        working-directory: mobile-app
        run: npm run build

      - name: Criar e sincronizar projeto Android
        working-directory: mobile-app
        run: |
          if (Test-Path 'android') {
            Remove-Item 'android' -Recurse -Force
          }

          npx cap add android
          if ($LASTEXITCODE -ne 0) {
            throw 'O Capacitor não conseguiu criar o projeto Android.'
          }

          npx cap sync android
          if ($LASTEXITCODE -ne 0) {
            throw 'O Capacitor não conseguiu sincronizar o projeto Android.'
          }

          if (-not (Test-Path 'android/gradlew.bat')) {
            throw 'O projeto Android foi criado sem o gradlew.bat.'
          }

      - name: Aplicar ajustes Android
        run: ./scripts/mobile/Aplicar-Ajustes-Android.ps1 "$pwd/mobile-app/android"

      - name: Gerar APK de teste ou assinado
        working-directory: mobile-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $signed = -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64) -and
                    -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_PASSWORD) -and
                    -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_ALIAS) -and
                    -not [string]::IsNullOrWhiteSpace($env:ANDROID_KEY_PASSWORD)

          if ($signed) {
            try {
              $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim())
              [IO.File]::WriteAllBytes("$pwd/smart-notes-release.jks", $bytes)
            } catch {
              throw 'ANDROID_KEYSTORE_BASE64 não contém uma chave válida em Base64.'
            }

            @'
            android {
                signingConfigs {
                    release {
                        storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                        keyAlias System.getenv("ANDROID_KEY_ALIAS")
                        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                    }
                }
            }
            '@ | Set-Content -Path app/signing.gradle -Encoding utf8

            $gradle = Get-Content app/build.gradle -Raw
            if ($gradle -notmatch "apply from: 'signing.gradle'") {
              Add-Content -Path app/build.gradle -Value "`napply from: 'signing.gradle'`n"
            }

            $env:ANDROID_KEYSTORE_FILE = "$pwd/smart-notes-release.jks"
            .\gradlew.bat assembleRelease --no-daemon --stacktrace
            if ($LASTEXITCODE -ne 0) { throw 'O Gradle não conseguiu gerar o APK release.' }
            $source = 'app/build/outputs/apk/release/app-release.apk'
            $tipo = 'assinado-release'
          } else {
            Write-Host 'Segredos de assinatura ausentes: gerando APK de teste (debug).' -ForegroundColor Yellow
            .\gradlew.bat assembleDebug --no-daemon --stacktrace
            if ($LASTEXITCODE -ne 0) { throw 'O Gradle não conseguiu gerar o APK debug.' }
            $source = 'app/build/outputs/apk/debug/app-debug.apk'
            $tipo = 'teste-debug'
          }

          if (-not (Test-Path $source)) {
            throw "O Gradle terminou, mas o APK não foi encontrado em: $source"
          }

          $destino = Join-Path $env:GITHUB_WORKSPACE 'APK'
          New-Item -ItemType Directory -Path $destino -Force | Out-Null
          Copy-Item $source (Join-Path $destino 'Smart-Notes.apk') -Force
          $hash = (Get-FileHash (Join-Path $destino 'Smart-Notes.apk') -Algorithm SHA256).Hash
          "Versão: 1.4.3`nTipo: $tipo`nSHA256: $hash" | Set-Content (Join-Path $destino 'Smart-Notes-SHA256.txt')
          "APK gerado no modo: $tipo" >> $env:GITHUB_STEP_SUMMARY

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Notes-APK-1.4.3
          path: APK/
          if-no-files-found: error
          retention-days: 30
